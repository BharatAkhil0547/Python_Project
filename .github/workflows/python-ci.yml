name: Python Calculator CI
on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps: 
            - name: checkout Code
              uses: actions/checkout@v4
            - name: setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: check Python syntax
              run: python -m compileall -q src/
    
    test:
        runs-on: ubuntu-latest

        steps:

            # download repistory code
            - name: checkout Code
              uses: actions/checkout@v4
            
            # install python
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            
            # install dependencies

            - name: install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r src/requirements.txt
            
            - name: Run Pytest
              run: python -m pytest -v src/
    
    report:
        needs: [build, test]
        runs-on: ubuntu-latest
        steps:
            - name: Display Result
              run: echo "Build and Test Completed Successfully"

              
              
